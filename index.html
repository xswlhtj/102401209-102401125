<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <!-- 核心业务规则 -->
  <script defer src="assets/js/core/status.js"></script>
  <script defer src="assets/js/core/validators.js"></script>

  <!-- 数据层 -->
  <script defer src="assets/js/data/demo-data.js"></script>
  <script defer src="assets/js/data/store.js"></script>

  <!-- 业务服务 -->
  <script defer src="assets/js/services/item-service.js"></script>

  <!-- 通用界面组件 -->
  <script defer src="assets/js/ui/item-card.js"></script>

  <!-- 页面渲染模块 -->
  <script defer src="assets/js/pages/home.js"></script>
  <script defer src="assets/js/pages/publish.js"></script>
  <script defer src="assets/js/pages/search.js"></script>
  <script defer src="assets/js/pages/detail.js"></script>
  <script defer src="assets/js/pages/my.js"></script>

  <!-- 控制器：只提供页面处理能力，不再各自监听 hashchange -->
  <script defer src="assets/js/feature-controller.js"></script>
  <script defer src="assets/js/publish-controller.js"></script>

  <!-- A：统一 Hash 路由 -->
  <script defer src="assets/js/router.js"></script>

  <!-- A：应用入口，最后启动 -->
  <script defer src="assets/js/app.js"></script>
  
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>
  <div class="app-shell">
    <main id="app" class="app-main" tabindex="-1">
      <!-- 预览脚本会替换此外壳；A 接入后仍通过 home.render 使用真实数据。 -->
      <header class="home-hero">
        <img class="home-hero__art" src="assets/images/figma/hero-main.svg" alt="" width="430" height="230">
        <h1>校园失物招领</h1>
        <p class="home-hero__description">让失物更快回到主人身边</p>
      </header>
    </main>
    <nav class="bottom-nav" aria-label="主要导航">
      <a class="bottom-nav__item" data-nav="home" href="#/home" aria-current="page"><svg class="nav-icon nav-icon--home" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 12 15 .8 28 12v16H2Z"/></svg><span>首页</span></a>
      <a class="bottom-nav__item" data-nav="publish" href="#/publish/lost"><svg class="nav-icon nav-icon--publish" viewBox="0 0 27 27" aria-hidden="true"><rect x="0.5" y="0.5" width="26" height="26" rx="6.5"/><path d="M13.5 7v13M7 13.5h13"/></svg><span>发布</span></a>
      <a class="bottom-nav__item" data-nav="my" href="#/my"><svg class="nav-icon nav-icon--profile" viewBox="0 0 30 29" aria-hidden="true"><circle cx="15" cy="8.4" r="7.4"/><path d="M2.6 28v-1.8c0-7 5.5-12.2 12.4-12.2s12.4 5.2 12.4 12.2V28"/></svg><span>我的</span></a>
      <span class="home-indicator" aria-hidden="true"></span>
    </nav>
  </div>
  <!-- 固定界面结构复用此模板，不含任何物品数据，不在加载时执行初始化。 -->
  <template id="home-template">
    <section class="home-page">
      <header class="home-hero">
        <img class="home-hero__art" src="assets/images/figma/hero-main.svg" alt="" width="430" height="230">
        <!-- 原型的装饰状态栏，不表示真实系统时间或设备状态。 -->
        <div class="prototype-status" aria-hidden="true">
          <span>9:41</span>
          <span class="prototype-status__icons">
            <span class="prototype-signal"><i></i><i></i><i></i><i></i></span>
            <span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span>
            <span class="prototype-battery"></span>
          </span>
        </div>
        <h1>校园失物招领</h1>
        <p class="home-hero__description">让失物更快回到主人身边</p>
      </header>
      <section class="home-panel" aria-label="首页信息">
        <a class="home-search" href="#/search"><span class="search-icon" aria-hidden="true"></span><span class="home-search__placeholder">搜索物品，例如：校园卡</span></a>
        <div class="home-actions">
          <a class="home-action home-action--lost" href="#/publish/lost"><span class="search-icon" aria-hidden="true"></span><span>发布寻物<span class="home-action__arrow" aria-hidden="true">›</span></span></a>
          <a class="home-action home-action--found" href="#/publish/found"><img src="assets/images/figma/box.svg" alt=""><span>发布招领<span class="home-action__arrow" aria-hidden="true">›</span></span></a>
        </div>
        <div class="home-feed__heading"><h2 id="home-feed-title">最新信息</h2><a class="home-feed__more" href="#/search?searched=1">更多 ›</a></div>
        <div class="home-scroll" role="region" aria-labelledby="home-feed-title" tabindex="0">
          <ul class="home-list"></ul>
        </div>
      </section>
    </section>
  </template>
  <template id="search-template">
    <section class="search-page">
      <header class="search-hero">
        <img class="search-hero__art" src="assets/images/figma/hero-main.svg" alt="" width="430" height="230">
        <div class="prototype-status" aria-hidden="true"><span>9:41</span><span class="prototype-status__icons"><span class="prototype-signal"><i></i><i></i><i></i><i></i></span><span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span><span class="prototype-battery"></span></span></div>
        <a class="page-back" href="#/home" aria-label="返回首页"><span></span></a>
        <h1>搜索物品</h1>
      </header>
      <section class="search-panel" aria-label="搜索失物招领信息">
        <form class="search-form" role="search">
          <label class="search-box" for="search-keyword"><span class="search-icon" aria-hidden="true"></span><input id="search-keyword" name="keyword" type="search" maxlength="50" autocomplete="off" placeholder="搜索物品，例如：校园卡"></label>
          <button class="search-submit" type="submit">搜索</button>
        </form>
        <div class="search-filters" aria-label="搜索筛选条件" hidden>
          <div class="search-type-filters" role="group" aria-label="物品类型">
            <button type="button" data-search-type="all">全部</button>
            <button type="button" data-search-type="lost"><span class="search-icon" aria-hidden="true"></span>寻物</button>
            <button type="button" data-search-type="found"><img src="assets/images/figma/box-muted.svg" alt="" width="25" height="25">招领</button>
          </div>
          <div class="search-extra-filters">
            <label for="search-category">物品类别</label>
            <select id="search-category" name="category"><option value="all">全部类别</option><option>电子设备</option><option>证件卡片</option><option>雨具</option><option>书籍资料</option><option>生活用品</option><option>其他</option></select>
            <button class="search-clear" type="button">清除条件</button>
          </div>
        </div>
        <div class="search-content" aria-live="polite"></div>
      </section>
    </section>
  </template>
  <template id="detail-template">
    <section class="detail-page">
      <header class="compact-hero">
        <img class="compact-hero__art" src="assets/images/figma/hero-main.svg" alt="" width="430" height="230">
        <div class="prototype-status" aria-hidden="true"><span>9:41</span><span class="prototype-status__icons"><span class="prototype-signal"><i></i><i></i><i></i><i></i></span><span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span><span class="prototype-battery"></span></span></div>
        <a class="page-back detail-back" href="#/home" aria-label="返回上一页"><span></span></a>
        <h1>信息详情</h1>
      </header>
      <section class="detail-panel" aria-labelledby="detail-title">
        <div class="detail-content">
          <img class="detail-image" alt="">
          <span class="detail-type"></span>
          <h2 id="detail-title"></h2>
          <div class="detail-info-box">
            <p><img src="assets/images/figma/clock.svg" alt="" width="20" height="20"><span data-detail-time-label></span><strong data-detail-date></strong></p>
            <p><img src="assets/images/figma/location.svg" alt="" width="20" height="20"><span data-detail-location-label></span><strong data-detail-location></strong></p>
            <p><span class="detail-status-icon" aria-hidden="true"></span><span>当前状态：</span><strong class="detail-status"></strong></p>
          </div>
          <h3>物品描述</h3>
          <p class="detail-description"></p>
          <h3>联系方式</h3>
          <p class="detail-contact"><span aria-hidden="true">♟</span><strong data-detail-contact></strong></p>
          <button class="detail-contact-action" type="button">联系发布者</button>
          <p class="detail-closed-note" hidden>该信息已经完成，不再引导联系发布者。</p>
        </div>
        <div class="detail-not-found" hidden>
          <div class="detail-not-found__mark" aria-hidden="true">?</div>
          <h2>没有找到这条信息</h2>
          <p>该记录可能已删除，或链接地址不正确。</p>
          <a class="detail-not-found__back" href="#/home">返回首页</a>
        </div>
      </section>
      <dialog class="contact-dialog" aria-labelledby="contact-dialog-title">
        <div class="dialog-handle" aria-hidden="true"></div>
        <button class="dialog-close" type="button" aria-label="关闭联系方式弹层">×</button>
        <h2 id="contact-dialog-title">联系发布者</h2>
        <p class="contact-dialog__intro">请通过以下方式联系发布者</p>
        <label for="contact-copy-value">联系方式</label>
        <input id="contact-copy-value" class="contact-copy-value" type="text" readonly>
        <button class="contact-copy-button" type="button">复制联系方式</button>
        <p class="contact-copy-feedback" role="status" aria-live="polite"></p>
      </dialog>
    </section>
  </template>
  <template id="profile-template">
    <section class="profile-page">
      <header class="compact-hero profile-hero">
        <img class="compact-hero__art" src="assets/images/figma/hero-main.svg" alt="" width="430" height="230">
        <div class="prototype-status" aria-hidden="true"><span>9:41</span><span class="prototype-status__icons"><span class="prototype-signal"><i></i><i></i><i></i><i></i></span><span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span><span class="prototype-battery"></span></span></div>
        <h1>个人资料</h1>
      </header>
      <section class="profile-panel" aria-label="个人资料">
        <article class="profile-card">
          <img class="profile-avatar" src="assets/images/figma/avatar.png" alt="张三的头像" width="94" height="94">
          <div><h2 data-profile-name>张三</h2><p>福州大学学生</p><span class="profile-school">🎓 福州大学</span></div>
        </article>
        <article class="profile-contact-card">
          <h2>我的联系方式</h2>
          <p><span class="profile-appicon profile-appicon--qq">QQ</span><span>QQ</span><strong data-profile-qq>123456789</strong></p>
          <p><span class="profile-appicon profile-appicon--phone">☎</span><span>手机号</span><strong data-profile-phone>138****5678</strong></p>
          <p><span class="profile-appicon profile-appicon--wechat">微</span><span>微信</span><strong data-profile-wechat>zhangsan_fzu</strong></p>
          <p><span class="profile-appicon profile-appicon--campus">●</span><span>常用校区/宿舍区</span><strong data-profile-campus>旗山校区 · 生活三区</strong></p>
        </article>
        <article class="profile-menu-card">
          <a class="profile-menu-row" href="#/my/published"><span class="profile-menu-icon">▣</span><span><strong>我的发布</strong><small>查看我发布的寻物与招领信息</small></span><span aria-hidden="true">›</span></a>
          <button class="profile-menu-row profile-edit-open" type="button"><span class="profile-menu-icon">✎</span><span><strong>编辑资料</strong><small>修改个人信息与联系方式</small></span><span aria-hidden="true">›</span></button>
        </article>
      </section>
      <dialog class="profile-edit-dialog" aria-labelledby="profile-edit-title">
        <div class="dialog-handle" aria-hidden="true"></div>
        <h2 id="profile-edit-title">编辑个人资料</h2>
        <form class="profile-edit-form" novalidate>
          <label>姓名<input name="name" type="text" maxlength="20" autocomplete="name"></label>
          <label>QQ<input name="qq" type="text" inputmode="numeric" maxlength="12" autocomplete="off"></label>
          <label>手机号<input name="phone" type="tel" inputmode="tel" maxlength="11" autocomplete="tel"></label>
          <label>微信<input name="wechat" type="text" maxlength="20" autocomplete="off"></label>
          <label>常用校区/宿舍区<input name="campus" type="text" maxlength="30" autocomplete="off"></label>
          <p class="profile-edit-error" role="alert" aria-live="assertive"></p>
          <button class="profile-edit-save" type="submit">保存修改</button>
          <button class="profile-edit-cancel" type="button">取消</button>
        </form>
      </dialog>
    </section>
  </template>
  <template id="my-published-template">
    <section class="my-published-page">
      <header class="compact-hero my-published-hero">
        <img class="compact-hero__art" src="assets/images/figma/hero-main.svg" alt="" width="430" height="230">
        <div class="prototype-status" aria-hidden="true"><span>9:41</span><span class="prototype-status__icons"><span class="prototype-signal"><i></i><i></i><i></i><i></i></span><span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span><span class="prototype-battery"></span></span></div>
        <a class="page-back" href="#/my" aria-label="返回个人资料"><span></span></a>
        <h1>我的发布</h1>
      </header>
      <section class="my-published-panel" aria-labelledby="my-published-title">
        <h2 id="my-published-title" class="visually-hidden">我发布的失物招领信息</h2>
        <div class="my-filters" role="group" aria-label="筛选我的发布">
          <button type="button" data-my-type="all">全部</button>
          <button type="button" data-my-type="lost"><span class="search-icon" aria-hidden="true"></span>寻物</button>
          <button type="button" data-my-type="found"><img src="assets/images/figma/box-muted.svg" alt="" width="25" height="25">招领</button>
        </div>
        <p class="my-feedback" role="status" aria-live="polite" hidden></p>
        <div class="my-published-scroll"><ul class="my-published-list"></ul><div class="my-published-state" hidden></div></div>
      </section>
      <dialog class="status-dialog" aria-labelledby="status-dialog-title">
        <div class="dialog-handle" aria-hidden="true"></div>
        <h2 id="status-dialog-title">修改物品状态</h2>
        <p class="status-dialog__intro"></p>
        <div class="status-dialog__target"><span class="status-radio" aria-hidden="true"></span><span><strong></strong><small></small></span></div>
        <p class="status-dialog__error" role="alert" aria-live="assertive"></p>
        <button class="status-confirm" type="button">确认修改</button>
        <button class="status-cancel" type="button">暂不修改</button>
      </dialog>
    </section>
  </template>
  <template id="status-success-template">
    <section class="status-success-page">
      <header class="compact-hero my-published-hero">
        <img class="compact-hero__art" src="assets/images/figma/hero-main.svg" alt="" width="430" height="230">
        <div class="prototype-status" aria-hidden="true"><span>9:41</span><span class="prototype-status__icons"><span class="prototype-signal"><i></i><i></i><i></i><i></i></span><span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span><span class="prototype-battery"></span></span></div>
        <a class="page-back" href="#/my/published" aria-label="返回我的发布"><span></span></a>
        <h1>我的发布</h1>
      </header>
      <section class="status-success-panel" aria-labelledby="status-success-title">
        <div class="status-success-mark" aria-hidden="true"><span></span></div>
        <h2 id="status-success-title">状态修改成功</h2>
        <p class="status-success-message"></p>
        <article class="status-success-card"><h3></h3><p><span>原状态</span><strong data-old-status></strong></p><p><span>新状态</span><strong data-new-status></strong></p></article>
        <a class="status-success-return" href="#/my/published">返回我的发布</a>
      </section>
    </section>
  </template>
  <template id="publish-template">
    <section class="publish-page">
      <header class="compact-hero">
        <img class="compact-hero__art" src="assets/images/figma/hero-publish.svg" alt="" width="430" height="230">
        <div class="prototype-status" aria-hidden="true">
          <span>9:41</span>
          <span class="prototype-status__icons">
            <span class="prototype-signal"><i></i><i></i><i></i><i></i></span>
            <span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span>
            <span class="prototype-battery"></span>
          </span>
        </div>
        <a class="page-back" href="#/home" aria-label="返回首页"><span></span></a>
        <h1>发布信息</h1>
      </header>
      <section class="publish-panel" aria-labelledby="publish-title">
        <h2 id="publish-title" class="visually-hidden">发布失物招领信息</h2>
        <form id="publish-form" novalidate>
          <div class="publish-tabs" role="tablist" aria-label="发布类型">
            <button class="publish-tab publish-tab--lost" type="button" role="tab" data-publish-type="lost"><span class="search-icon" aria-hidden="true"></span><span>寻物</span></button>
            <button class="publish-tab publish-tab--found" type="button" role="tab" data-publish-type="found"><img src="assets/images/figma/box-muted.svg" alt="" width="25" height="25"><span>招领</span></button>
          </div>
          <div class="publish-fields">
            <div class="publish-row" data-field-row="name"><label for="publish-name">物品名称</label><div><input id="publish-name" name="name" type="text" maxlength="31" placeholder="请输入物品名称" aria-describedby="publish-name-error"><small id="publish-name-error" class="field-error"></small></div></div>
            <div class="publish-row" data-field-row="category"><label for="publish-category">物品类别</label><div><select id="publish-category" name="category" required aria-describedby="publish-category-error"><option value="">请选择物品类别</option><option>电子设备</option><option>证件卡片</option><option>雨具</option><option>书籍资料</option><option>生活用品</option><option>其他</option></select><small id="publish-category-error" class="field-error"></small></div></div>
            <div class="publish-row" data-field-row="eventDate"><label for="publish-date">时间</label><div><input id="publish-date" name="eventDate" type="date" aria-describedby="publish-date-error"><small id="publish-date-error" class="field-error"></small></div></div>
            <div class="publish-row" data-field-row="location"><label for="publish-location">地点</label><div><input id="publish-location" name="location" type="text" maxlength="51" aria-describedby="publish-location-error"><small id="publish-location-error" class="field-error"></small></div></div>
            <div class="publish-row publish-row--description" data-field-row="description"><label for="publish-description">物品描述</label><div><textarea id="publish-description" name="description" maxlength="201" placeholder="请填写物品颜色、外观、特征等信息" aria-describedby="publish-description-error publish-description-count"></textarea><span id="publish-description-count" class="description-count">0/200</span><small id="publish-description-error" class="field-error"></small></div></div>
            <div class="publish-row publish-row--upload" data-field-row="image"><span class="publish-label">物品图片</span><div class="upload-picker"><label class="upload-control" for="publish-image"><span class="upload-control__plus" aria-hidden="true">＋</span><span class="upload-control__text">上传图片</span><img class="upload-preview" alt="已选择的物品图片预览"><span class="upload-control__replace">点击更换</span></label><button class="upload-remove" type="button" hidden>删除图片</button><input id="publish-image" class="visually-hidden" name="imageFile" type="file" accept="image/*" aria-describedby="publish-image-error"><small id="publish-image-error" class="field-error"></small></div></div>
            <div class="publish-row" data-field-row="contactType"><label for="publish-contact-type">联系方式</label><div><select id="publish-contact-type" name="contactType" required aria-describedby="publish-contact-type-error"><option value="">请选择联系方式</option><option value="QQ">QQ</option><option value="微信">微信</option><option value="手机号">手机号</option></select><small id="publish-contact-type-error" class="field-error"></small></div></div>
            <div class="publish-row" data-field-row="contactValue"><label for="publish-contact">联系账号</label><div><input id="publish-contact" name="contactValue" type="text" maxlength="30" placeholder="请先选择联系方式" aria-describedby="publish-contact-error"><small id="publish-contact-error" class="field-error"></small></div></div>
          </div>
          <p class="publish-form-error" role="alert" aria-live="polite"></p>
          <button class="publish-submit" type="submit">发布信息</button>
        </form>
      </section>
    </section>
  </template>
  <template id="publish-success-template">
    <section class="publish-page publish-page--success">
      <header class="compact-hero">
        <img class="compact-hero__art" src="assets/images/figma/hero-success.svg" alt="" width="430" height="230">
        <div class="prototype-status" aria-hidden="true"><span>9:41</span><span class="prototype-status__icons"><span class="prototype-signal"><i></i><i></i><i></i><i></i></span><span class="prototype-wifi"><img class="prototype-wifi__lines" src="assets/images/figma/wifi-lines.svg" alt=""><img class="prototype-wifi__dot" src="assets/images/figma/wifi-dot.svg" alt=""></span><span class="prototype-battery"></span></span></div>
        <a class="page-back" href="#/home" aria-label="返回首页"><span></span></a>
